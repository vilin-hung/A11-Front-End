<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulasi: Hukum Ohm</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Hukum Ohm</h1> 
  <div class="main-wrapper">
    <main class="simulator">
      <!-- tampilan V = I R -->
      <section class="rumus">
        <span id="teganganListrik">V</span>
        <span>=</span>
        <span id="arusListrik">I</span>
        <span id="hambatanListrik">R</span>
      </section>

      <!-- tampilan rangkaian listrik -->
      <section class="rangkaianListrik">
        <div class="kotakBaterai" id="baterai">
        <!-- space kosong utk tampilan baterai, 1 baterai penuh = 1.5 V -->
        </div>

        <div class="hasilArusListrik">
          Arus Listrik =
          <span id="nilaiArus">00.0</span> <!-- nilai akan berubah-ubah sesuai V dan R -->
          <span>mA</span>
        </div>

        <!-- space kosong utk tampilan hambatan (R) -->
        <div class="kotakHambatan"></div>
      </section>

      <section class="panelKontrol">
        <div class="kontrolTegangan">
          <h2>V</h2>
          <p>tegangan</p>
          <!-- slider tegangan 0.1 V - 9 V dengan nilai awal 4.5 V -->
          <div class="sliderVertikal">
            <input
              type="range"
              id="sliderTegangan"
              min="0.1"
              max="9.0"
              step="0.1"
              value="4.5"   
            >
          </div>
          <!-- nilaiTegangan yang ditampilkan akan berubah-ubah sesuai nilai pada sliderTegangan -->
          <p> <span id="nilaiTegangan">4.5</span> V </p>
        </div>

        <div class="kontrolHambatan">
          <h2>R</h2>
          <p>hambatan</p>
          <!-- slider hambatan 10 Ω - 1000 Ω dengan nilai awal 100 Ω -->
          <div class="sliderVertikal">
            <input
              type="range"
              id="sliderHambatan"
              min="10"
              max="1000"
              step="5"
              value="100"
            >
          </div>
          <!-- nilaiHambatan yang ditampilkan akan berubah-ubah sesuai nilai pada sliderHambatan -->
          <p> <span id="nilaiHambatan">100</span> Ω </p>
        </div>
      </section>

    </main>

  <!-- TODO: bagian instruksi @marmar -->
    <aside class="instruction-panel">
      <h2>instruksi</h2>
      <p>adalah pokoknya</p>
    </aside>
  </div>
</body>
</html>
