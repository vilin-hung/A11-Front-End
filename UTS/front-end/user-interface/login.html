<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk & Daftar - JelajahRasa</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <main id="main-content" class="login-page">
        <div class="login-container">
            
            <!-- Logo Navigasi ke Beranda -->
            <div class="login-logo-wrapper">
                <a id="logo-brand" href="index.html" class="login-logo">
                    <i class='bx bx-map-pin'></i> JelajahRasa
                </a>
            </div>

            <div class="login-card">
                <div class="login-card-body">
                    
                    <!-- Tab Navigasi Switch Form -->
                    <ul class="nav nav-pills nav-justified login-tabs" id="auth-tab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="tab-login" data-bs-toggle="pill" data-bs-target="#content-login" type="button" role="tab">Masuk</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="tab-register" data-bs-toggle="pill" data-bs-target="#content-register" type="button" role="tab">Daftar</button>
                        </li>
                    </ul>

                    <div class="tab-content" id="auth-tab-content">
                        
                        <!-- Form Masuk (Login) -->
                        <div class="tab-pane fade show active" id="content-login" role="tabpanel">
                            <form id="form-login">
                                <div class="login-form-group">
                                    <label for="login-email" class="login-label">Email</label>
                                    <input type="email" class="login-input" id="login-email" placeholder="nama@email.com" required>
                                </div>
                                <div class="login-form-group">
                                    <label for="login-password" class="login-label">Kata Sandi</label>
                                    <input type="password" class="login-input" id="login-password" placeholder="••••••••" required>
                                </div>
                                <button type="submit" id="btn-submit-login" class="login-submit-btn">Masuk</button>
                            </form>
                        </div>

                        <!-- Form Daftar (Register) -->
                        <div class="tab-pane fade" id="content-register" role="tabpanel">
                            <form id="form-register">
                                <div class="login-form-group">
                                    <label for="register-name" class="login-label">Nama Lengkap</label>
                                    <input type="text" class="login-input" id="register-name" placeholder="Contoh: Budi Santoso" required>
                                </div>
                                <div class="login-form-group">
                                    <label for="register-email" class="login-label">Email</label>
                                    <input type="email" class="login-input" id="register-email" placeholder="nama@email.com" required>
                                </div>
                                <div class="login-form-group">
                                    <label for="register-city" class="login-label">Kota / Kabupaten Domisili</label>
                                    <input type="text" class="login-input" id="register-city" placeholder="Contoh: Kota Bandung / Kab. Bandung" required>
                                </div>
                                <div class="login-form-group">
                                    <label for="register-password" class="login-label">Buat Kata Sandi</label>
                                    <input type="password" class="login-input" id="register-password" placeholder="Minimal 6 karakter" required>
                                </div>
                                <div class="login-form-group">
                                    <label for="register-password-confirm" class="login-label">Konfirmasi Kata Sandi</label>
                                    <input type="password" class="login-input" id="register-password-confirm" placeholder="Ulangi kata sandi" required>
                                </div>
                                <button type="submit" id="btn-submit-register" class="login-submit-btn">Daftar Akun</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="login-back-wrapper">
                <a href="index.html" class="login-back-link">&larr; Kembali ke Beranda</a>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="../js/auth.js"></script>
</body>
</html>
