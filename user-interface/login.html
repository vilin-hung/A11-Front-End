<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk & Daftar - JelajahRasa</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main id="main-content" class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <!-- Logo Navigasi ke Beranda -->
                <div class="text-center mb-4">
                    <a id="logo-brand" href="index.html" class="text-decoration-none h3 text-success fw-bold">
                        <i class='bx bx-map-pin'></i> JelajahRasa
                    </a>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        
                        <!-- Tab Navigasi Switch Form -->
                        <ul class="nav nav-pills nav-justified mb-4" id="auth-tab" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="tab-login" data-bs-toggle="pill" data-bs-target="#content-login" type="button" role="tab">Masuk</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="tab-register" data-bs-toggle="pill" data-bs-target="#content-register" type="button" role="tab">Daftar</button>
                            </li>
                        </ul>

                        <div class="tab-content" id="auth-tab-content">
                            
                            <!-- Form Masuk (Login) -->
                            <div class="tab-pane fade show active" id="content-login" role="tabpanel">
                                <form id="form-login">
                                    <div class="mb-3">
                                        <label for="login-email" class="form-label">Email</label>
                                        <input type="email" class="form-control" id="login-email" placeholder="nama@email.com" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="login-password" class="form-label">Kata Sandi</label>
                                        <input type="password" class="form-control" id="login-password" placeholder="••••••••" required>
                                    </div>
                                    <button type="submit" id="btn-submit-login" class="btn btn-success w-100 mt-2">Masuk</button>
                                </form>
                            </div>

                            <!-- Form Daftar (Register) -->
                            <div class="tab-pane fade" id="content-register" role="tabpanel">
                                <form id="form-register">
                                    <div class="mb-3">
                                        <label for="register-name" class="form-label">Nama Lengkap</label>
                                        <input type="text" class="form-control" id="register-name" placeholder="Contoh: Budi Santoso" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="register-email" class="form-label">Email</label>
                                        <input type="email" class="form-control" id="register-email" placeholder="nama@email.com" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="register-city" class="form-label">Kota / Kabupaten Domisili</label>
                                        <input type="text" class="form-control" id="register-city" placeholder="Contoh: Kota Bandung / Kab. Bandung" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="register-password" class="form-label">Buat Kata Sandi</label>
                                        <input type="password" class="form-control" id="register-password" placeholder="Minimal 6 karakter" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="register-password-confirm" class="form-label">Konfirmasi Kata Sandi</label>
                                        <input type="password" class="form-control" id="register-password-confirm" placeholder="Ulangi kata sandi" required>
                                    </div>
                                    <button type="submit" id="btn-submit-register" class="btn btn-success w-100 mt-2">Daftar Akun</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="text-center mt-3">
                    <a href="index.html" class="text-secondary small text-decoration-none">&larr; Kembali ke Beranda</a>
                </div>
            </div>
        </div>
    </main>
    <!-- Tambahkan script logika login, jika email dan pass 'admin' maka redirect ke admin-dashboard.html, lainnya index.html -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
